name: WorthChex tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  calculator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run JavaScript syntax checks
        run: |
          node --check calculator-suite-final.js
          node --check financial-suite-v4.js
          node --check reset-fixes.js
          node --check site.js
      - name: Run whole-site HTML, link and asset audit
        run: node tests/site-audit.test.js
      - name: Run known-answer accuracy tests
        run: node tests/accuracy.test.js
      - name: Run calculator suite tests
        run: node tests/calculator-suite.test.js
      - name: Run new calculator regression tests
        run: node tests/new-tools-regression.test.js
      - name: Run reset regression tests
        run: node tests/reset-fixes.test.js
      - name: Run salary period-switch regression test
        run: node tests/salary-period-switch.test.js
